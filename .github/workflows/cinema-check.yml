name: Cinema validation
on:
  push:
    branches:
      - feature/discord-cinema-activity
  pull_request:
    branches:
      - main
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check backend syntax
        run: node --check cinema/server.js
      - name: Check Activity module syntax
        run: |
          node -e "const fs=require('fs'); const h=fs.readFileSync('cinema/public/index.html','utf8'); const m=h.match(/<script type=\"module\">([\s\S]*?)<\/script>/); if(!m) process.exit(1); fs.writeFileSync('/tmp/cinema-activity.mjs',m[1]);"
          node --check /tmp/cinema-activity.mjs
      - name: Validate package manifest
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json valid')"
